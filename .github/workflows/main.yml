name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name NovaIPTVPlayer `
            --collect-all PySide6 `
            --collect-all av `
            main.py

          if (-not (Test-Path "dist\NovaIPTVPlayer.exe")) {
            throw "PyInstaller did not produce dist\NovaIPTVPlayer.exe"
          }

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: NovaIPTVPlayer-windows
          path: dist/NovaIPTVPlayer.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: NovaIPTVPlayer-windows
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/NovaIPTVPlayer.exe
          generate_release_notes: true
